name: Windows checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Repository checks
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Install Chromium for UI checks
        run: npx playwright install chromium
      - name: UI integration checks
        run: npm run test:ui
      - name: Workbench feature UI checks
        run: npm run test:workbench
      - name: Conversation and tab UI checks
        run: npm run test:productivity
      - name: Tab overflow UI checks
        run: npm run test:tabs
      - name: Dual pane UI checks
        run: npm run test:panes
      - name: SFTP queue UI checks
        run: npm run test:transfers
      - name: SSH file access UI checks
        run: npm run test:ssh-files
      - name: Rendering stability UI checks
        run: node tools/ui_smoke.cjs --render-stability
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Rust tests
        working-directory: src-tauri
        run: cargo +stable test --locked --bin dalizi-files
      - name: Build Windows application from the source ZIP
        run: |
          python tests/test_package_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $delivery = Join-Path $env:RUNNER_TEMP 'dalizi-source'
          python tools/package_source.py --output-dir $delivery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem -LiteralPath $delivery -Filter '*.zip' -File
          if (@($archive).Count -ne 1) { throw 'Expected one source archive' }
          $unpacked = Join-Path $delivery 'unpacked'
          python -m zipfile -e $archive.FullName $unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Set-Location (Join-Path $unpacked "dalizi-files-$version/src-tauri")
          cargo +stable build --locked --release --bin dalizi-files

  harness:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            resources/harness/dev-runtime/package-lock.json
      - name: Prepare isolated, locked desktop test runtime
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dev = Join-Path $env:LOCALAPPDATA 'DaliziDev'
          $nodeDir = New-Item -ItemType Directory -Path (Join-Path $dev 'node-v24.22.1-win-x64') -Force
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination $nodeDir.FullName
          $prefix = New-Item -ItemType Directory -Path (Join-Path $dev 'runtime-0.2.2-rc.3') -Force
          Copy-Item resources/harness/dev-runtime/package*.json -Destination $prefix.FullName
          npm ci --prefix $prefix.FullName --ignore-scripts --no-audit --no-fund
      - name: Protocol, snapshot boundaries and loopback model
        run: .\tools\verify_harness.ps1 -Toolchain stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated SSH fixture dependency
        run: python -m pip install ((Get-Content tools/requirements-dev.txt) -match '^paramiko==')
      - name: Desktop routing, review, recovery, web selection and scoped SFTP snapshots
        run: .\tools\verify_harness_desktop.ps1 -Toolchain stable

  harness-release:
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that independent release reports cannot substitute for one another
        run: |
          python tests/test_preview_promotion.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_windows_guest_report.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_cloud_acceptance.py
      - name: Build the component from integrity-pinned inputs
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputZip=Join-Path $env:RUNNER_TEMP 'node-win-x64.zip'
          Invoke-WebRequest 'https://nodejs.org/dist/v24.22.1/node-v24.22.1-win-x64.zip' -OutFile $inputZip
          python tools/package_harness_component.py --node-zip $inputZip --output src-tauri/target/verified-component
      - name: Release opt-in, component integrity, diagnostics and process lifetime
        run: .\tools\verify_harness_release.ps1 -Toolchain stable -Component (Get-ChildItem src-tauri/target/verified-component/*.zip).FullName
      - name: Check production candidate contents and notices
        run: |
          cargo +stable fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --release --locked --manifest-path src-tauri/Cargo.toml --bin dalizi-files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/collect_windows_notices.py --output src-tauri/target/candidate-notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_windows.py --licenses src-tauri/target/candidate-notices --component (Get-ChildItem src-tauri/target/verified-component/*.zip).FullName
      - name: Read and edit the same project across the old public binary and the new packaged binary
        run: |
          python tests/test_public_rollback.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = @(Get-ChildItem dist/*-harness-integration-*.zip)
          if ($candidate.Count -ne 1) { throw 'Expected exactly one fresh integration build' }
          python tools/verify_public_rollback.py --candidate $candidate[0].FullName --ci-exe src-tauri/target/release/dalizi-files.exe --report "$env:RUNNER_TEMP/dalizi-chat-rollback.json"
      - name: Preserve the measured cross-version rollback report
        uses: actions/upload-artifact@v7
        with:
          name: chat-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dalizi-chat-rollback.json
          if-no-files-found: error
