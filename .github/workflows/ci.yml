name: Windows checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Repository checks
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Install Chromium for UI checks
        run: npx playwright install chromium
      - name: UI integration checks
        run: npm run test:ui
      - name: Workbench feature UI checks
        run: npm run test:workbench
      - name: Conversation and tab UI checks
        run: npm run test:productivity
      - name: Tab overflow UI checks
        run: npm run test:tabs
      - name: Dual pane UI checks
        run: npm run test:panes
      - name: SFTP queue UI checks
        run: npm run test:transfers
      - name: SSH file access UI checks
        run: npm run test:ssh-files
      - name: Rendering stability UI checks
        run: node tools/ui_smoke.cjs --render-stability
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Rust tests
        working-directory: src-tauri
        run: cargo +stable test --locked --bin dalizi-files
      - name: Build Windows application
        working-directory: src-tauri
        run: cargo +stable build --locked --release --bin dalizi-files
