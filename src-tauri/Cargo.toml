[package]
name = "dalizi-files"
version = "0.4.0"
edition = "2021"
description = "A Windows file explorer and AI workbench built with Rust and Tauri"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
notify = "6"
quick-xml = "0.42"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinHttp", "Win32_Security_Credentials"] }
portable-pty = "0.9.0"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
calamine = { version = "=0.36.1", features = ["dates"] }
csv = "1"
encoding_rs = "0.8"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
sha2 = "0.10"
zeroize = "1"
rfd = { version = "0.17", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
