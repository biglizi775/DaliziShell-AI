[package]
name = "dalizi-harness-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time", "sync"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
